[package]
name = "vornix-skills"
version = "0.1.0"
edition = "2021"
description = "Skill loading and indexing for the Vornix AI coding harness"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
globset = "0.4"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"
