[package]
name = "vornix"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
resolver = "2"
members = [
    "crates/vornix-core",
    "crates/vornix-providers",
    "crates/vornix-mcp",
    "crates/vornix-tools",
    "crates/vornix-skills",
    "crates/vornix-memory",
    "crates/vornix-git",
    "crates/vornix-secrets",
    "crates/vornix-persona",
    ".",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

rmcp = { version = "0.1", features = ["client", "server", "transport-child-process", "transport-io"] }

git2 = "0.19"

keyring = { version = "3", features = ["sync-secret-service"] }
age = "0.11"
chacha20poly1305 = "0.10"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

anyhow = "1"
thiserror = "2"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

tiktoken-rs = "0.6"

globset = "0.4"
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
toml = "0.8"

vornix-core = { path = "crates/vornix-core" }
vornix-providers = { path = "crates/vornix-providers" }
vornix-mcp = { path = "crates/vornix-mcp" }
vornix-tools = { path = "crates/vornix-tools" }
vornix-skills = { path = "crates/vornix-skills" }
vornix-memory = { path = "crates/vornix-memory" }
vornix-git = { path = "crates/vornix-git" }
vornix-secrets = { path = "crates/vornix-secrets" }
vornix-persona = { path = "crates/vornix-persona" }

[dependencies]
vornix-core.workspace = true
vornix-providers.workspace = true
vornix-mcp.workspace = true
vornix-tools.workspace = true
vornix-skills.workspace = true
vornix-memory.workspace = true
vornix-git.workspace = true
vornix-secrets.workspace = true
vornix-persona.workspace = true

tauri.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-dialog.workspace = true

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs.workspace = true
reqwest.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile = "3"
vornix-memory.workspace = true
vornix-mcp.workspace = true
vornix-secrets.workspace = true
vornix-persona.workspace = true
vornix-tools.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
