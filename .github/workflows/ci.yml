name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: npx vite build

  rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Only the library crates — the tauri binary crate needs webkit2gtk system deps
      - name: Unit tests
        run: cargo test -p vornix-core -p vornix-tools -p vornix-memory -p vornix-persona -p vornix-skills -p vornix-secrets -p vornix-git
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy -p vornix-core -p vornix-tools -p vornix-memory -p vornix-persona -p vornix-skills -p vornix-secrets -p vornix-git -- -D warnings || true
        working-directory: src-tauri
